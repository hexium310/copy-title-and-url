name: CD
on:
  push:
    tags:
      - '**'

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          cache: true
      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - name: Install dependencies
        run: pnpm ci
      - name: Build
        run: pnpm build
      - name: Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: release/copy-title-and-url-*.xpi
          fail_on_unmatched_files: true
          make_latest: true
