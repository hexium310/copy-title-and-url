name: CI

on:
  - push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          cache: true
      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - name: Install dependencies
        run: pnpm ci
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build
